# Pull requests opened by the Claude Code action (branches claude/**) are
# built here and merged into main automatically when the build passes.
# Production deploys from main (Vercel). A failed build leaves the PR open
# and comments on it; the teacher's chat shows "failed" and Rafael is
# notified by GitHub as the repository owner. A PR that conflicts with main
# is handed back to Claude to bring up to date, then this runs again.
name: Auto-merge Claude's pull requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  build-and-merge:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Conflicts with main? hand it back to Claude
        id: conflicts
        run: |
          state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeable --jq .mergeable)
          echo "mergeable=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "CONFLICTING" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@claude This pull request conflicts with main. Merge origin/main into this branch, resolve every conflict so that BOTH the behaviour already on main and this PR's intent are kept, run npm run build, and push. Do not open a new PR."
          fi

      - name: Node
        if: steps.conflicts.outputs.mergeable != 'CONFLICTING'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.conflicts.outputs.mergeable != 'CONFLICTING'
        run: npm ci

      - name: Build (type check included)
        id: build
        if: steps.conflicts.outputs.mergeable != 'CONFLICTING'
        run: npm run build
        env:
          # the build needs no real secrets; placeholders keep env checks quiet
          TURSO_DATABASE_URL: file:local.db
          AUTH_SECRET: ci-placeholder-secret
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder

      - name: Merge
        id: merge
        if: steps.conflicts.outputs.mergeable != 'CONFLICTING'
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --subject "$PR_TITLE (#$PR_NUMBER)"

      - name: Close the issue and tell the teacher
        if: steps.merge.outcome == 'success'
        run: |
          issue=$(printf "%s" "$PR_BODY" | grep -oE 'Closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$issue" ]; then
            # comment first: GitHub may already have closed the issue via "Closes #N" on
            # the merge, and `gh issue close` on a closed issue posts nothing
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "✅ השינוי מוזג ועולה לאתר עכשיו (כ-3 דקות לפריסה)." || true
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          fi

      - name: Report a failed build or merge
        if: failure() && (steps.build.outcome == 'failure' || steps.merge.outcome == 'failure')
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "❌ הבנייה נכשלה, ולכן השינוי לא מוזג. @RefaelBassel — צריך מבט אנושי. יומן הריצה: $RUN_URL"
          issue=$(printf "%s" "$PR_BODY" | grep -oE 'Closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "❌ הבנייה של השינוי נכשלה. רפאל קיבל הודעה ויטפל." || true
          fi
