# Requests from the teacher's chat arrive here as issues labelled `claude-chat`
# (the site opens them, already labelled — so only `opened` triggers, never
# `labeled` too, or the same issue would be built twice). Claude Code implements the request on a branch,
# verifies the build, and opens a pull request that says "Closes #N".
# `auto-merge.yml` then builds the PR and merges it when green — no human
# step; production deploys from main. @claude mentions in comments also work.
# Cost (Rafael, 2026-11-03): Sonnet 5.5 builds by default; an issue labelled
# `large` (set by the site's chat for big features) is built with Opus 5.5.
# Turn caps keep a build that loops on fixes from running up the bill.
name: Claude — build what the teacher asked

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  implement:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'claude-chat') || contains(github.event.issue.body, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Claude Code — bring a pull request up to date
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are on the branch of pull request #${{ github.event.issue.number }} in the repository described in CLAUDE.md (read it first). Do exactly what this comment asks, on this branch, and push; do not open another pull request:

            ${{ github.event.comment.body }}

            If it asks you to resolve conflicts: `git fetch origin main && git merge origin/main`, resolve every conflict keeping both main's behaviour and this branch's intent, run `npm ci && npm run build` until green, commit and push.
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'large') && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 50
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(npm ci),Bash(npm install:*),Bash(npm run build),Bash(npm run lint:*),Bash(npx tsc:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"

      - name: Claude Code — build what the issue asks
        id: build
        if: github.event_name == 'issues' || !github.event.issue.pull_request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are working in the repository of the Hebrew learning site described in CLAUDE.md. Read CLAUDE.md and AGENTS.md first and follow them (Hebrew UI, English code and commit messages, Next.js 16 conventions, every save/action button shows its state, students never see teacher-only affordances).

            A teacher asked for the change below through the site's chat (issue #${{ github.event.issue.number }}). Implement it completely and carefully.

            Title: ${{ github.event.issue.title }}

            Request:
            ${{ github.event.issue.body }}

            ${{ github.event_name == 'issue_comment' && format('Latest comment on the issue: {0}', github.event.comment.body) || '' }}

            Steps:
            1. Create and switch to a branch named claude/issue-${{ github.event.issue.number }} (append a short suffix if it exists).
            2. Make the change. Keep it focused; do not refactor unrelated code.
            3. Run `npm ci` and `npm run build`. Fix every error until the build passes.
            4. Commit with a clear English message, push the branch, and open a pull request with `gh pr create` whose body starts with "Closes #${{ github.event.issue.number }}" and then explains, in Hebrew, what changed from the teacher's point of view (two or three sentences). Do not merge it.
            5. Finally comment on the issue, in Hebrew, with one or two sentences for the teacher: what was built and that it goes live automatically once the build passes.
            If the request is unclear or impossible, do not guess: comment on the issue in Hebrew with one focused question and stop.
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'large') && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 60
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue comment:*),Bash(npm ci),Bash(npm install:*),Bash(npm run build),Bash(npm run lint:*),Bash(npx tsc:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"

      # What this build cost (from Claude's own result; no conversation text).
      - name: Cost of this build
        if: always() && steps.build.outcome != 'skipped'
        run: |
          f="${{ steps.build.outputs.execution_file }}"
          [ -f "$f" ] || f=/home/runner/work/_temp/claude-execution-output.json
          [ -f "$f" ] && jq -r '[.[] | select(.type == "result")] | last | "cost_usd=\(.total_cost_usd) turns=\(.num_turns) duration_min=\((.duration_ms // 0) / 60000 | floor)"' "$f" || echo "no execution file"

      # The action hides Claude's output (this repository is public). When a
      # run fails, print only the final result's error text, never the
      # conversation, so the cause is visible in the log.
      - name: Why did Claude stop? (error text only)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          f="${{ steps.build.outputs.execution_file }}"
          [ -f "$f" ] || f=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$f" ]; then
            jq -r '[.[] | select(.type == "result")] | last | "subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns)"' "$f" || true
            jq -r '[.[] | select(.type == "result")] | last | "result: " + (.result // "-" | tostring | .[0:600])' "$f" || true
          else
            echo "no execution file"
          fi

      # Tell the teacher at once (in the chat card and on the issue) instead of
      # leaving the request looking "in progress". Labels drive the site's
      # status: waiting-credit = the API account needs credit (the site
      # retries by itself); build-failed = something else, Rafael looks.
      # Never write "@claude" here — that would trigger another run.
      - name: Report the failure to the teacher
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.event.issue.number }}
        run: |
          f="${{ steps.build.outputs.execution_file }}"
          [ -f "$f" ] || f=/home/runner/work/_temp/claude-execution-output.json
          why=$( [ -f "$f" ] && jq -r '[.[] | select(.type == "result")] | last | (.result // "") | tostring' "$f" 2>/dev/null || echo "")
          have=$(gh issue view "$N" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          if echo "$why" | grep -qi "credit balance"; then
            gh label create waiting-credit --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "API account needs credit; the site retries" 2>/dev/null || true
            gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --add-label waiting-credit --remove-label build-failed 2>/dev/null || true
            case ",$have," in *,waiting-credit,*) ;; *)
              gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "⏸️ הבנייה ממתינה: נגמר הקרדיט בחשבון ה-API של Claude (console.anthropic.com ← Plans & Billing). @RefaelBassel — צריך להוסיף קרדיט. הבקשה לא אבדה: האתר ינסה שוב מעצמו כל שעה, והיא תיבנה ברגע שהקרדיט יחזור." ;;
            esac
          else
            gh label create build-failed --repo "$GITHUB_REPOSITORY" --color D93F0B --description "the build did not finish" 2>/dev/null || true
            gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --add-label build-failed 2>/dev/null || true
            case ",$have," in *,build-failed,*) ;; *)
              gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "❌ הבנייה נעצרה ולא הושלמה. @RefaelBassel — צריך מבט. יומן הריצה: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" ;;
            esac
          fi

